<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .header {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 { margin: 0; color: #2196F3; }
    .subtitulo { color: #666; margin-top: 5px; }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      margin-top: 5px;
    }

    .info-saldo {
      margin-top: 10px;
      background: #e3f2fd;
      padding: 10px;
      border-radius: 8px;
      color: #0d47a1;
      font-weight: bold;
    }

    #catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .titulo-categoria {
      width: 100%;
      grid-column: 1 / -1;
      margin-top: 25px;
      margin-bottom: 5px;
      padding-bottom: 8px;
      color: #1976D2;
      border-bottom: 2px solid #2196F3;
      font-size: 20px;
    }

    .titulo-categoria:first-child {
      margin-top: 0;
    }

    .producto {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.10);
      transition: .2s;
    }

    .producto:hover { transform: translateY(-3px); }

    .producto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .producto-info { padding: 12px; text-align: center; }
    .producto-info h3 { margin: 0; min-height: 40px; }

    .precio {
      color: #2e7d32;
      font-size: 24px;
      font-weight: bold;
      margin-top: 8px;
    }

    .stock { color: #777; margin-top: 5px; margin-bottom: 10px; }

    .btn-agregar {
      width: 100%;
      border: none;
      background: #4CAF50;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-agregar:hover { background: #388E3C; }
    .btn-agregar:disabled { background: #ccc; cursor: not-allowed; }

    .carrito {
      background: white;
      margin-top: 25px;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,.10);
    }

    .item-carrito { margin-bottom: 15px; }

    .btn-cantidad {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: #2196F3;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-cantidad:disabled {
      background: #b0bec5;
      cursor: not-allowed;
    }

    .resumen-totales {
      border-top: 2px solid #eee;
      padding-top: 10px;
      margin-top: 15px;
    }

    .total {
      font-size: 22px;
      color: #2e7d32;
      font-weight: bold;
    }

    .saldo-final {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .alerta-exceso {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      resize: none;
      margin-top: 10px;
    }

    .btn-enviar {
      width: 100%;
      background: #FF9800;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      margin-top: 15px;
      cursor: pointer;
    }

    .btn-enviar:hover { background: #F57C00; }
    .btn-enviar:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>

<body>

  <div class="header">
    <h1>🛒 Pulpería Familiar</h1>
    <div class="subtitulo">Escoge tus productos favoritos</div>
    <br>

    <label><b>Cliente</b></label>
    <select id="cliente" onchange="actualizarUsuarioSeleccionado()"></select>

    <div id="infoSaldo" class="info-saldo">
      💳 Saldo disponible: ₡<span id="saldoCliente">0</span>
    </div>
  </div>

  <div id="catalogo">Cargando catálogo...</div>

  <div class="carrito">
    <h2>🛍️ Mi Carrito</h2>

    <div id="carrito">Carrito vacío</div>

    <div id="alertaExceso" class="alerta-exceso">
      ⚠️ El total supera el saldo disponible del usuario.
    </div>

    <textarea id="comentario" placeholder="Comentario del pedido"></textarea>

    <button id="btnEnviar" class="btn-enviar" onclick="enviarPedido()">
      ✅ Enviar Pedido
    </button>
  </div>

<script>
// ⚠️ SUSTITUYE ESTE ENLACE POR TU URL DE GOOGLE APPS SCRIPT (/exec)
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbw3ebDmfctZrs6z7GEsG-HhcMfY5WIXjtKa3qtj9LHgS6G0lkY2GtRh_sDwRJX_kCqWog/exec";

let carrito = [];
let listaProductos = [];
let listaUsuarios = [];
let saldoUsuarioActual = 0;

// Carga inicial mediante fetch HTTP
fetch(`${URL_WEB_APP}?accion=obtenerDatos`)
  .then(res => res.json())
  .then(datos => {
    cargarUsuarios(datos.usuarios);
    cargarProductos(datos.productos);
  })
  .catch(err => {
    alert("Error al cargar la información: " + err.message);
  });

function cargarUsuarios(usuarios) {
  listaUsuarios = usuarios || [];
  const select = document.getElementById("cliente");
  select.innerHTML = "";

  listaUsuarios.forEach(u => {
    select.innerHTML += `<option value="${u.nombre}">${u.nombre}</option>`;
  });

  actualizarUsuarioSeleccionado();
}

function actualizarUsuarioSeleccionado() {
  const nombreSeleccionado = document.getElementById("cliente").value;
  const usuario = listaUsuarios.find(u => u.nombre === nombreSeleccionado);

  if (usuario) {
    saldoUsuarioActual = usuario.saldo;
    document.getElementById("saldoCliente").innerText = saldoUsuarioActual.toLocaleString();
  }
  renderCarrito();
}

function cargarProductos(productos) {
  listaProductos = productos || [];
  const catalogo = document.getElementById("catalogo");
  catalogo.innerHTML = "";

  const categorias = listaProductos.reduce((acc, prod) => {
    const cat = prod.categoria || "Otros";
    if (!acc[cat]) acc[cat] = [];
    acc[cat].push(prod);
    return acc;
  }, {});

  for (const [categoria, prods] of Object.entries(categorias)) {
    catalogo.innerHTML += `<h2 class="titulo-categoria">📌 ${categoria}</h2>`;

    prods.forEach(p => {
      catalogo.innerHTML += `
        <div class="producto">
          <img src="${p.imagen}" alt="${p.producto}">
          <div class="producto-info">
            <h3>${p.producto}</h3>
            <div class="precio">₡${p.precio}</div>
            <div class="stock">Stock: ${p.inventario}</div>
            <button
              class="btn-agregar"
              ${p.inventario <= 0 ? 'disabled' : ''}
              onclick="agregar('${p.id}')">
              ${p.inventario <= 0 ? 'Agotado' : '🛒 Agregar'}
            </button>
          </div>
        </div>
      `;
    });
  }
}

function agregar(id) {
  const prod = listaProductos.find(p => p.id === id);
  const item = carrito.find(x => x.id === id);

  if (!prod) return;

  if (item) {
    if (item.cantidad < prod.inventario) {
      item.cantidad++;
    } else {
      alert("Alcanzaste el límite de stock disponible.");
    }
  } else {
    if (prod.inventario > 0) {
      carrito.push({
        id: prod.id,
        producto: prod.producto,
        precio: prod.precio,
        cantidad: 1,
        inventario: prod.inventario
      });
    }
  }
  renderCarrito();
}

function aumentar(id) {
  const item = carrito.find(x => x.id === id);
  if (item) {
    if (item.cantidad < item.inventario) {
      item.cantidad++;
      renderCarrito();
    } else {
      alert("No hay más unidades en stock.");
    }
  }
}

function disminuir(id) {
  const item = carrito.find(x => x.id === id);
  if (item) {
    item.cantidad--;
    if (item.cantidad <= 0) {
      carrito = carrito.filter(x => x.id !== id);
    }
  }
  renderCarrito();
}

function renderCarrito() {
  const div = document.getElementById("carrito");
  const alertaExceso = document.getElementById("alertaExceso");
  const btnEnviar = document.getElementById("btnEnviar");
  
  let total = 0;
  div.innerHTML = "";

  if (carrito.length === 0) {
    div.innerHTML = "Carrito vacío";
    alertaExceso.style.display = "none";
    btnEnviar.disabled = false;
    return;
  }

  carrito.forEach(item => {
    const subtotal = item.precio * item.cantidad;
    total += subtotal;

    div.innerHTML += `
      <div class="item-carrito">
        <b>${item.producto}</b>
        <br><br>
        <button class="btn-cantidad" onclick="disminuir('${item.id}')">-</button>
        ${item.cantidad}
        <button 
          class="btn-cantidad" 
          ${item.cantidad >= item.inventario ? 'disabled' : ''} 
          onclick="aumentar('${item.id}')">+</button>
        <br><br>
        ₡${subtotal.toLocaleString()}
      </div>
      <hr>
    `;
  });

  const saldoFinal = saldoUsuarioActual - total;

  div.innerHTML += `
    <div class="resumen-totales">
      <div class="total">Total: ₡${total.toLocaleString()}</div>
      <div class="saldo-final" style="color: ${saldoFinal < 0 ? '#c62828' : '#1565c0'}">
        Saldo final: ₡${saldoFinal.toLocaleString()}
      </div>
    </div>
  `;

  if (total > saldoUsuarioActual) {
    alertaExceso.style.display = "block";
    btnEnviar.disabled = true;
  } else {
    alertaExceso.style.display = "none";
    btnEnviar.disabled = false;
  }
}

function enviarPedido() {
  if (carrito.length === 0) {
    alert("Debes agregar productos.");
    return;
  }

  const cliente = document.getElementById("cliente").value;
  const comentario = document.getElementById("comentario").value;

  const btn = document.getElementById("btnEnviar");
  btn.disabled = true;
  btn.innerText = "⏳ Procesando pedido...";

  const url = `${URL_WEB_APP}?accion=guardarPedido&cliente=${encodeURIComponent(cliente)}&comentario=${encodeURIComponent(comentario)}&carrito=${encodeURIComponent(JSON.stringify(carrito))}`;

  fetch(url)
    .then(res => res.json())
    .then(resultado => {
      if (resultado.error) {
        throw new Error(resultado.error);
      }
      alert(
        "✅ Pedido enviado\n\n" +
        "Pedido: " + resultado.pedidoID +
        "\nSaldo restante: ₡" + resultado.saldoRestante.toLocaleString()
      );
      location.reload();
    })
    .catch(error => {
      alert("❌ " + error.message);
      btn.disabled = false;
      btn.innerText = "✅ Enviar Pedido";
    });
}
</script>

</body>
</html>
