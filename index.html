<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Saldo NFC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #111827; color: white; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .card-container {
      background: #1f2937; border: 2px solid #374151; border-radius: 24px;
      padding: 25px; width: 100%; max-width: 400px; text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.5rem; color: #9ca3af; margin-bottom: 20px; }
    .btn-scan {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white;
      border: none; padding: 18px 24px; font-size: 1.2rem; font-weight: bold;
      border-radius: 16px; width: 100%; cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    }
    .btn-scan:active { transform: scale(0.96); }
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .nfc-pulse {
      width: 100px; height: 100px; background: #2563eb; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
      margin-bottom: 20px; animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
    .balance-box {
      background: #1f2937; border-radius: 24px; padding: 25px;
      width: 100%; max-width: 380px; text-align: center; border: 1px solid #374151;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .user-name { font-size: 1.8rem; font-weight: bold; color: #f3f4f6; }
    .number-counter { font-size: 3rem; font-weight: 900; color: #10b981; margin: 10px 0; }
    .visual-vault {
      background: #111827; border-radius: 16px; padding: 20px; margin: 15px 0;
      min-height: 120px; display: flex; flex-wrap: wrap; gap: 14px;
      align-items: center; justify-content: center; border: 1px dashed #374151;
    }
    .item-graphic { display: flex; flex-direction: column; align-items: center; animation: dropDown 0.5s ease forwards; }
    .item-label { font-size: 0.7rem; color: #9ca3af; font-weight: bold; margin-top: 4px; }
    @keyframes dropDown { 0% { transform: translateY(-30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    .btn-close { background: #374151; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; margin-top: 10px; cursor: pointer; width: 100%; }
    
    /* Diseños gráficos vectoriales */
    .gold-bar-svg { width: 46px; height: 28px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  </style>
</head>
<body>

  <div class="card-container">
    <h1>🏦 Bóveda Digital</h1>
    <button class="btn-scan" onclick="iniciarEscaneoNFC()">💳 Acercar Tarjeta</button>
  </div>

  <div id="modalLectura" class="modal-overlay">
    <div class="nfc-pulse">📲</div>
    <h2>Acerca la tarjeta al celular</h2>
    <p style="color: #9ca3af; margin-top: 8px;">Mantén la tarjeta firme en la parte trasera...</p>
    <button class="btn-close" onclick="cerrarModales()" style="margin-top: 30px; width: auto;">Cancelar</button>
  </div>

  <div id="modalResultado" class="modal-overlay">
    <div class="balance-box">
      <div id="nombreUsuario" class="user-name">---</div>
      <div id="saldoNumero" class="number-counter">₡0</div>
      <p style="font-size: 0.85rem; color: #9ca3af;">Representación gráfica en bóveda:</p>
      <div id="bovedaGrafica" class="visual-vault"></div>
      <button class="btn-close" onclick="cerrarModales()">Entendido</button>
    </div>
  </div>

  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/TU_CODIGO_AQUI/exec";

    let ndefController = null;

    async function iniciarEscaneoNFC() {
      if (!('NDEFReader' in window)) {
        alert("⚠️ Web NFC no está disponible. Abre esta página en Google Chrome para Android.");
        return;
      }

      document.getElementById('modalLectura').style.display = 'flex';

      try {
        ndefController = new AbortController();
        const ndef = new NDEFReader();
        await ndef.scan({ signal: ndefController.signal });

        ndef.addEventListener("reading", ({ message, serialNumber }) => {
          let idNfc = serialNumber || "";

          for (const record of message.records) {
            if (record.recordType === "text") {
              const textDecoder = new TextDecoder(record.encoding || "utf-8");
              idNfc = textDecoder.decode(record.data);
            }
          }

          cerrarModales();
          if (idNfc) {
            consultarEnServidor(idNfc);
          } else {
            alert("No se pudo obtener la tarjeta.");
          }
        });

      } catch (error) {
        if (error.name !== 'AbortError') {
          alert("Error NFC: " + error.message);
          cerrarModales();
        }
      }
    }

    function consultarEnServidor(idNfc) {
      fetch(`${URL_WEB_APP}?idNfc=${encodeURIComponent(idNfc)}`)
        .then(response => response.json())
        .then(data => { renderizarResultado(data); })
        .catch(err => { alert("Error al conectar con la base de datos: " + err.message); });
    }

    function renderizarResultado(res) {
      if (!res.exito) {
        alert("❌ " + res.mensaje);
        return;
      }
      document.getElementById('nombreUsuario').innerText = res.nombre;
      document.getElementById('modalResultado').style.display = 'flex';
      animarContador(res.saldo);
      dibujarBoveda(res.saldo);
    }

    function animarContador(saldoFinal) {
      const el = document.getElementById('saldoNumero');
      let actual = 0;
      const incremento = Math.ceil(saldoFinal / 30);
      const timer = setInterval(() => {
        actual += incremento;
        if (actual >= saldoFinal) { actual = saldoFinal; clearInterval(timer); }
        el.innerText = "₡" + actual.toLocaleString();
      }, 20);
    }

    function dibujarBoveda(saldoExacto) {
      const boveda = document.getElementById('bovedaGrafica');
      boveda.innerHTML = "";
      const saldoGrafico = Math.floor(saldoExacto / 50) * 50;
      const lingotes = Math.floor(saldoGrafico / 1000);
      let resto = saldoGrafico % 1000;
      const torres = Math.floor(resto / 100);
      resto = resto % 100;
      const monedas = Math.floor(resto / 50);

      const lingoteSVG = `
        <svg class="gold-bar-svg" viewBox="0 0 50 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 22L2 10H42L48 22H8Z" fill="url(#goldGrad1)"/>
          <path d="M2 10L8 3H48L42 10H2Z" fill="url(#goldGrad2)"/>
          <path d="M42 10L48 22V22L48 10H42Z" fill="#B45309"/>
          <path d="M8 22L2 10H42L48 22H8Z" stroke="#78350F" stroke-width="0.8"/>
          <path d="M2 10L8 3H48L42 10H2Z" stroke="#78350F" stroke-width="0.8"/>
          <defs>
            <linearGradient id="goldGrad1" x1="2" y1="10" x2="48" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FBBF24"/>
              <stop offset="0.5" stop-color="#D97706"/>
              <stop offset="1" stop-color="#92400E"/>
            </linearGradient>
            <linearGradient id="goldGrad2" x1="2" y1="3" x2="48" y2="10" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FEF08A"/>
              <stop offset="1" stop-color="#F59E0B"/>
            </linearGradient>
          </defs>
        </svg>`;

      let delay = 0;
      for (let i = 0; i < lingotes; i++) {
        boveda.innerHTML += `<div class="item-graphic" style="animation-delay: ${delay}s">${lingoteSVG}<span class="item-label">₡1,000</span></div>`;
        delay += 0.12;
      }
      for (let i = 0; i < torres; i++) {
        boveda.innerHTML += `<div class="item-graphic" style="animation-delay: ${delay}s">💰<span class="item-label">₡1,000</span></div>`;
        delay += 0.08;
      }
      for (let i = 0; i < monedas; i++) {
        boveda.innerHTML += `<div class="item-graphic" style="animation-delay: ${delay}s; font-size: 2.2rem;">🟡<span class="item-label">₡50</span></div>`;
        delay += 0.08;
      }
      if (lingotes === 0 && torres === 0 && monedas === 0) {
        boveda.innerHTML = `<span style="color: #6b7280;">Sin fondos en bóveda</span>`;
      }
    }

    function cerrarModales() {
      if (ndefController) ndefController.abort();
      document.getElementById('modalLectura').style.display = 'none';
      document.getElementById('modalResultado').style.display = 'none';
    }
  </script>
</body>
</html>
